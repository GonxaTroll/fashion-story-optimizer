services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data  # named volume avoids macOS VirtioFS mmap issues with DuckDB
    env_file:
      - path: ./backend/.env
        required: true

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - path: ./frontend/.env
        required: true
    depends_on:
      - backend

volumes:
  db_data:

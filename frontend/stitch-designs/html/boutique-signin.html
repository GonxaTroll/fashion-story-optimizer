<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In | Glimmer Boutique</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Be+Vietnam+Pro:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-color: #fff4f8;
            background-image: radial-gradient(#ffecf5 2px, transparent 2px);
            background-size: 32px 32px;
        }
        .bubblegum-gradient {
            background: linear-gradient(135deg, #a8216e 0%, #ff6cb5 100%);
        }
        .soft-well {
            box-shadow: inset 0 2px 4px rgba(70, 34, 62, 0.05);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#5b0038",
                        "on-error-container": "#510017",
                        "outline": "#966988",
                        "surface-container-low": "#ffecf5",
                        "background": "#fff4f8",
                        "on-background": "#46223e",
                        "inverse-primary": "#fa65b0",
                        "on-secondary-fixed": "#5d006d",
                        "surface-variant": "#ffcfee",
                        "primary-dim": "#980f61",
                        "secondary-container": "#fcbcff",
                        "on-secondary-fixed-variant": "#8a0b9f",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#d09ec0",
                        "on-tertiary": "#bffff5",
                        "surface-container": "#ffdff2",
                        "surface-container-highest": "#ffcfee",
                        "secondary-fixed-dim": "#f9a7ff",
                        "on-primary-container": "#4a002c",
                        "on-surface": "#46223e",
                        "error": "#b41340",
                        "primary-container": "#ff6cb5",
                        "surface-bright": "#fff4f8",
                        "tertiary": "#00675f",
                        "on-tertiary-fixed": "#00423c",
                        "tertiary-fixed-dim": "#43e2d2",
                        "surface-container-high": "#ffd7f0",
                        "on-tertiary-fixed-variant": "#006159",
                        "on-primary": "#ffeff3",
                        "primary-fixed-dim": "#f05da8",
                        "on-secondary-container": "#7c0091",
                        "secondary": "#9720ab",
                        "surface-dim": "#ffc2eb",
                        "tertiary-dim": "#005a52",
                        "surface": "#fff4f8",
                        "on-tertiary-container": "#00574f",
                        "on-surface-variant": "#784e6c",
                        "tertiary-container": "#56f1e0",
                        "on-secondary": "#ffeefb",
                        "inverse-surface": "#20031b",
                        "on-primary-fixed": "#000000",
                        "secondary-dim": "#89089e",
                        "inverse-on-surface": "#bf8eaf",
                        "tertiary-fixed": "#56f1e0",
                        "error-dim": "#a70138",
                        "primary-fixed": "#ff6cb5",
                        "primary": "#a8216e",
                        "on-error": "#ffefef",
                        "surface-tint": "#a8216e",
                        "error-container": "#f74b6d",
                        "secondary-fixed": "#fcbcff"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Be Vietnam Pro"],
                        "label": ["Plus Jakarta Sans"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-pattern font-body text-on-surface min-h-screen flex items-center justify-center p-6">
<main class="w-full max-w-md relative">
<!-- Decorative Floating Elements -->
<div class="absolute -top-12 -left-12 w-24 h-24 rounded-full bg-tertiary-container opacity-40 blur-2xl"></div>
<div class="absolute -bottom-16 -right-8 w-32 h-32 rounded-full bg-secondary-container opacity-30 blur-3xl"></div>
<!-- The "Board" / Sign-in Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(70,34,62,0.08)] overflow-hidden relative border-t-8 border-primary-container">
<!-- Branding Header -->
<div class="px-8 pt-10 pb-6 text-center">
<div class="inline-flex items-center justify-center w-16 h-16 bg-surface-container rounded-full mb-6">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="auto_awesome">auto_awesome</span>
</div>
<h1 class="font-headline text-3xl font-black italic tracking-tight text-primary mb-2">Glimmer Boutique</h1>
<p class="text-on-surface-variant font-medium">Welcome back, gorgeous!</p>
</div>
<!-- Login Form -->
<form class="px-8 pb-10 space-y-6">
<!-- Email Input Group -->
<div class="space-y-2">
<label class="font-label text-sm font-bold text-on-surface-variant ml-2 flex items-center gap-2">
<span class="material-symbols-outlined text-xs" data-icon="mail">mail</span>
                        Email Address
                    </label>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-5 py-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 soft-well transition-all outline-none" placeholder="hello@glimmer.com" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div class="space-y-2">
<div class="flex justify-between items-center px-2">
<label class="font-label text-sm font-bold text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-xs" data-icon="lock">lock</span>
                            Password
                        </label>
<a class="text-xs font-bold text-secondary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-lg px-5 py-4 text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 soft-well transition-all outline-none" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center px-2">
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-container-high peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
<span class="ms-3 text-sm font-medium text-on-surface-variant">Stay playful (Remember me)</span>
</label>
</div>
<!-- Sign In Button -->
<button class="bubblegum-gradient w-full py-4 rounded-full text-on-primary font-headline font-extrabold text-lg shadow-[0_10px_20px_rgba(168,33,110,0.3)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-3" type="button">
                    Sign In
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Social/Alternative Logic -->
<div class="bg-surface-container-low/50 px-8 py-6 text-center">
<p class="text-sm font-medium text-on-surface-variant">
                    New to the boutique? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Create an account</a>
</p>
</div>
</div>
<!-- Fun Bottom Graphic -->
<div class="mt-12 flex justify-center gap-4 opacity-60">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-secondary-container"></div>
<div class="w-2 h-2 rounded-full bg-tertiary-container"></div>
</div>
</main>
<!-- Footer from Shared Components JSON -->
<footer class="fixed bottom-0 left-0 right-0 flex flex-col items-center gap-6 py-12 px-4 w-full bg-pink-100 dark:bg-fuchsia-900/40 rounded-t-[3rem] mt-12">
<div class="flex gap-8">
<a class="font-be-vietnam text-sm font-medium text-pink-500 hover:underline decoration-2 underline-offset-4" href="#">About</a>
<a class="font-be-vietnam text-sm font-medium text-pink-500 hover:underline decoration-2 underline-offset-4" href="#">Support</a>
<a class="font-be-vietnam text-sm font-medium text-pink-500 hover:underline decoration-2 underline-offset-4" href="#">Privacy</a>
<a class="font-be-vietnam text-sm font-medium text-pink-500 hover:underline decoration-2 underline-offset-4" href="#">Terms</a>
</div>
<div class="text-lg font-black text-pink-800 dark:text-pink-200 uppercase tracking-widest">
            © 2024 GLIMMER BOUTIQUE. STAY PLAYFUL.
        </div>
</footer>
</body></html>
